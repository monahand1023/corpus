[project]
name = "corpus-rag"
version = "0.3.0"
description = "Single-user RAG framework for personal archives. Local-first, MCP-native."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "corpus contributors" }]
keywords = ["rag", "retrieval", "mcp", "embeddings", "personal-archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    # Pin compatible ranges, not floors — these 0.x SDKs ship breaking-ish
    # changes mid-0.x. The embedder SDKs (voyageai / google-genai) are NOT here:
    # they live in optional extras so the base install stays minimal and
    # provider-agnostic (see [project.optional-dependencies]).
    "sqlite-vec>=0.1.9,<0.2",
    "mcp>=1.28.1,<2.0",
    "pydantic>=2.13.4,<3.0",
    "python-dotenv>=1.2.2,<2.0",
]

[project.optional-dependencies]
# Optional: Voyage AI embeddings (the default, highest-quality provider). Kept
# opt-in because voyageai pulls a large transitive tree (langchain-core, pillow,
# ffmpeg-python) that corpus itself never imports. Relaxed to <0.5 so the 0.4.x
# line — which ships cp314 wheels — can install on Python 3.14.
voyage = ["voyageai>=0.3.7,<0.5"]
# Optional: local cross-encoder re-ranker. ~2GB of deps (torch + transformers
# + sentence-transformers); only install if you actually want re-ranking.
# torch>=2.13.0 keeps us above the GHSA-rrmf-rvhw-rf47 (CVE-2025-3000) range
# (torch.jit.script memory corruption; <= 2.12.0). corpus never calls jit.script,
# but the floor stops the lock regressing into the vulnerable range.
reranker = ["sentence-transformers>=5.5.0,<6.0", "torch>=2.13.0"]
# Optional: Claude Haiku per-doc summaries.
summarizer = ["anthropic>=0.50,<1.0"]
pdf = ["pypdf>=6.11.0,<7.0"]
html = ["trafilatura>=2.0.0,<3.0"]
gemini = ["google-genai>=2.2.0,<3.0"]
docx = ["python-docx>=1.2.0,<2.0"]
xlsx = ["openpyxl>=3.1.5,<4.0"]
rtf = ["striprtf>=0.0.33,<0.1"]
all = [
    "voyageai>=0.3.7,<0.5",
    "sentence-transformers>=5.5.0,<6.0",
    "torch>=2.13.0",
    "anthropic>=0.50,<1.0",
    "pypdf>=6.11.0,<7.0",
    "trafilatura>=2.0.0,<3.0",
    "google-genai>=2.2.0,<3.0",
    "python-docx>=1.2.0,<2.0",
    "openpyxl>=3.1.5,<4.0",
    "striprtf>=0.0.33,<0.1",
]

[project.scripts]
corpus-init = "corpus.cli.init:main"
corpus-ingest = "corpus.cli.ingest:main"
corpus-query = "corpus.cli.query:main"
corpus-eval = "corpus.cli.eval:main"
corpus-judge = "corpus.cli.judge:main"
corpus-mcp = "corpus.mcp_server:main"
corpus-summarize = "corpus.cli.summarize:main"
corpus-benchmark = "corpus.cli.benchmark:main"
corpus-list = "corpus.cli.list_sources:main"
corpus-reset = "corpus.cli.reset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[tool.hatch.build.targets.sdist]
# Explicit ALLOWLIST: ship ONLY these paths. hatchling would otherwise sweep in
# untracked local scratch (agent notes under .superpowers/, review .diff files,
# reports) that is gitignored but NOT git-excluded from the sdist — a real leak
# vector. Keep tests/docs/examples for downstream users; everything else is dropped.
include = [
    "src",
    "tests",
    "docs",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = ["uv.lock", ".venv", "dist", "*.db", ".superpowers", "docs/superpowers", "**/*.diff"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "mypy>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF003", "SIM108", "UP047", "SIM103"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# CI runs `mypy src/` only, and this exclude makes that a deliberate choice
# rather than an accident: `mypy src tests` (as of 2026-09) surfaces ~225
# errors across 19 files, nearly all `no-untyped-def`/`no-untyped-call` from
# Mock-heavy test helpers and fixtures, not real bugs. Widening CI to cover
# tests/ would mean annotating the suite -- a real, separately-scoped piece of
# work, not something to fold in here. The exclude keeps `mypy tests/` (or
# `mypy .`) from re-surfacing that noise for anyone who runs it directly, and
# stops a genuine bug in a test file (as one was, once) from hiding in that
# noise unnoticed. If you DO annotate the suite later, drop this line and add
# tests/ to CI's mypy step in the same change.
exclude = ["^tests/"]

# sqlite-vec ships no stubs or py.typed marker.
[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

# voyageai has inline types but doesn't re-export `Client` explicitly.
[[tool.mypy.overrides]]
module = "voyageai"
implicit_reexport = true

# openpyxl ships no stubs or py.typed marker.
[[tool.mypy.overrides]]
module = "openpyxl"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
